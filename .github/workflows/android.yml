name: 构建一维相册（安卓）

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'BUILD_ERRORS.txt']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_RUN: ${{ github.run_number }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出一维相册
        uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: CI 环境配置（去掉本机 aapt2 路径）
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 签名配置
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KEY_PW" "${KEY_ALIAS:-yiwei}" "$KEY_PW" > keystore.properties
            echo "SIGN=正式签名" >> "$GITHUB_ENV"
          else
            # 测试签名：公开的测试密钥，只用于测试版，保证测试版之间可以覆盖安装
            printf 'storeFile=%s\nstorePassword=yiwei-test\nkeyAlias=yiwei\nkeyPassword=yiwei-test\n' "$GITHUB_WORKSPACE/signing/yiwei-album-test.p12" > keystore.properties
            echo "SIGN=测试签名" >> "$GITHUB_ENV"
          fi
          echo "$SIGN"

      - name: 编译 APK
        run: |
          gradle --no-daemon --console=plain :app:assembleRelease -PciRun=${VERSION_RUN}
          ls -la app/build/outputs/apk/release/

      - name: 整理安装包
        run: |
          set -e
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"; export APP_VERSION=$V
          mkdir dist
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$f" dist/yiwei-album.apk
          # App 内「检查更新」读这个文件（只走 GitHub，不再用网盘）
          export VC=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          export SHA=$(sha256sum dist/yiwei-album.apk | cut -d' ' -f1)
          export SIZE=$(stat -c%s dist/yiwei-album.apk)
          export MSG="$(git log -1 --pretty=%B)"
          python3 - <<'PY'
          import json, os
          json.dump({
              "versionCode": int(os.environ["VC"]),
              "versionName": os.environ["APP_VERSION"],
              "build": int(os.environ["VERSION_RUN"]),
              "notes": "CI #%s：%s" % (os.environ["VERSION_RUN"], os.environ["MSG"].strip()[:1500]),
              "apk": "https://github.com/yiweishurufa/yiwei-album/releases/download/android-nightly/yiwei-album.apk",
              "sha256": os.environ["SHA"],
              "size": int(os.environ["SIZE"]),
              "commit": os.environ["GITHUB_SHA"],
          }, open("dist/version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          PY
          cat dist/version.json
          ls -la dist

      - uses: actions/upload-artifact@v6
        with:
          name: yiwei-album-android
          path: |
            dist/*.apk
            dist/version.json

      - name: 发布安卓测试版
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="一维相册 Android 测试版 ${APP_VERSION}（CI #${VERSION_RUN}，提交 ${GITHUB_SHA::7}，${SIGN}）。固定下载地址：https://github.com/${GITHUB_REPOSITORY}/releases/download/android-nightly/yiwei-album.apk 。测试签名与正式版签名不同，首次安装需先卸载旧版。"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null || echo "tag move refused, keeping old tag"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/android-nightly -f sha="$GITHUB_SHA" >/dev/null || echo "tag create refused"
          fi
          if gh release view android-nightly >/dev/null 2>&1; then
            gh release upload android-nightly dist/yiwei-album.apk dist/version.json --clobber
            gh release edit android-nightly --prerelease --title "一维相册 安卓测试版" --notes "$NOTES"
          else
            gh release create android-nightly dist/yiwei-album.apk dist/version.json --target "$GITHUB_SHA" --prerelease --title "一维相册 安卓测试版" --notes "$NOTES"
          fi
